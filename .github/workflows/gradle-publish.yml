name: Build RIPTIDE Knife Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build Fabric mod
        working-directory: riptide-knife-lab-milestone1/riptide-knife-lab
        run: gradle build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RIPTIDE-Knife-Lab-JAR
          path: riptide-knife-lab-milestone1/riptide-knife-lab/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
